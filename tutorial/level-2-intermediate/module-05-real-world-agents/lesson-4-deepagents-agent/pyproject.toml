[project]
name = "harbor-tutorial-L2-M5-deepagents-agent"
version = "0.1.0"
description = "Deepagents in Harbor"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.16",
    # >=0.6 for the backends API (BaseSandbox / SandboxBackendProtocol)
    "deepagents>=0.6",
    # ChatOpenAI speaks to the OpenAI-compatible LiteLLM proxy
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.4",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
# Lint/format policy comes from the repo-root ruff.toml (one place to change it).
# It must be pulled in explicitly: a leaf carrying [tool.ruff] SHADOWS the root
# config entirely rather than merging with it, so without this line the leaf
# silently runs ruff's own defaults (413 rules, line-length 88).
extend = "../../../../ruff.toml"
# This lesson directory is its own source root, so sibling modules
# (results.py, helpers.py, agent.py) sort as first-party imports
# whether ruff is invoked here or from the repo root.
src = ["."]
