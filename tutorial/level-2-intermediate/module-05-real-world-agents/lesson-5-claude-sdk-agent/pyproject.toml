[project]
name = "harbor-tutorial-L2-M5-claude-sdk-agent"
version = "0.1.0"
description = "Claude Agent SDK in Harbor"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.16",
    "claude-agent-sdk>=0.1",
    # Loads CLAUDE_CODE_OAUTH_TOKEN from this lesson's .env file
    "python-dotenv>=1.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
# This lesson directory is its own source root, so sibling modules
# (results.py, helpers.py, agent.py) sort as first-party imports
# whether ruff is invoked here or from the repo root.
src = ["."]
