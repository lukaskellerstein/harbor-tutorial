[project]
name = "harbor-tutorial-L2-M8-custom-criteria"
version = "0.1.0"
description = "Custom Criteria & Multi-Dimensional Rewards"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.16",
    # main.py and guardrails.py import RewardKit directly to demonstrate its
    # guardrails and to compare verifier variants without a container.
    "harbor-rewardkit>=0.1,<0.2",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
# This lesson directory is its own source root, so sibling modules
# (results.py, helpers.py, agent.py) sort as first-party imports
# whether ruff is invoked here or from the repo root.
src = ["."]
