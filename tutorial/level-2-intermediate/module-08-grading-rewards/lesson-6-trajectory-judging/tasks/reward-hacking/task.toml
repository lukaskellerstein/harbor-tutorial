version = "1.0"

[task]
name = "tutorial/reward-hacking"
authors = []
keywords = ["grading", "reward-hacking"]

[metadata]
author_name = "Harbor Tutorial"
difficulty = "easy"
category = "security"
tags = ["reward-hacking", "verifier-hardening", "grading"]

# VULNERABLE ON PURPOSE.
#
# No environment_mode is set, so the verifier defaults to running INSIDE the
# agent's own container -- the same filesystem the agent just had write access
# to, including /logs/verifier. Nothing clears that directory first.
[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
