schema_version = "1.3"

[task]
name = "harbor-tutorial/configured-task"
description = "A richly configured task demonstrating task.toml options"
authors = [
    { name = "Harbor Tutorial", email = "tutorial@example.com" }
]
keywords = ["tutorial", "configuration", "metadata"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["python", "environment-variables", "configuration"]
tutorial_lesson = "task-metadata"
custom_field = "You can add any key-value pairs here"

[agent]
timeout_sec = 120.0

[verifier]
timeout_sec = 30.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 512
workdir = "/workspace"

[environment.env]
GREETING_NAME = "Harbor"

[solution.env]
GREETING_NAME = "Harbor"
